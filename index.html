        // --- 2. SOUND UTILS ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'spin') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'pop') {
                    osc.disconnect(); 
                    const notes = [523.25, 659.25, 783.99, 1046.50]; 
                    notes.forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'sine';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(ctx.destination);
                        
                        const start = now + (i * 0.05);
                        g.gain.setValueAtTime(0, start);
                        g.gain.linearRampToValueAtTime(0.1, start + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
                        
                        o.start(start);
                        o.stop(start + 0.3);
                    });
                } else if (type === 'print') {
                   osc.type = 'triangle';
                   osc.frequency.setValueAtTime(800, now);
                   osc.frequency.linearRampToValueAtTime(100, now + 0.1);
                   gain.gain.setValueAtTime(0.1, now);
                   gain.gain.linearRampToValueAtTime(0, now + 0.1);
                   osc.start(now);
                   osc.stop(now + 0.1);
                }
            } catch (e) {
                console.error("Sound play failed", e);
            }

        // VendingMachine Component
        const VendingMachine = () => {
          const [currentWord, setCurrentWord] = useState(null);
          const [isSpinning, setIsSpinning] = useState(false);
          const [isLucky, setIsLucky] = useState(false);
          const [availableIndices, setAvailableIndices] = useState([]);
          const receiptRef = useRef(null);
          const [isDownloading, setIsDownloading] = useState(false);

          useEffect(() => {
            resetDeck();
          }, []);

          const resetDeck = () => {
            const indices = Array.from({ length: WORDS.length }, (_, i) => i);
            setAvailableIndices(indices);
          };

          const handleDispense = () => {
            if (isSpinning) return;
            
            playSound('click');
            playSound('spin');
            setIsSpinning(true);
            setCurrentWord(null); 
            setIsLucky(false);

            setTimeout(() => {
              let nextIndices = [...availableIndices];
              
              if (nextIndices.length === 0) {
                nextIndices = Array.from({ length: WORDS.length }, (_, i) => i);
              }

              const randomIndexInPool = Math.floor(Math.random() * nextIndices.length);
              const selectedWordIndex = nextIndices[randomIndexInPool];
              
              const luckyChance = Math.random() < 0.1;
              setIsLucky(luckyChance);

              nextIndices.splice(randomIndexInPool, 1);
              
              setAvailableIndices(nextIndices);
              setCurrentWord(WORDS[selectedWordIndex]);
              
              setIsSpinning(false);
              playSound('pop');
              
              if (confetti) {
                confetti({
                  particleCount: luckyChance ? 300 : 150,
                  spread: luckyChance ? 120 : 80,
                  origin: { y: 0.6 },
                  colors: luckyChance ? ['#FFD700', '#FACC15', '#FFFFFF'] : ['#FACC15', '#FFFFFF', '#000000']
                });
              }

            }, 800);
          };

          const handleDownloadReceipt = async () => {
              if (!receiptRef.current) return;
              setIsDownloading(true);
              playSound('click');
              playSound('print');
              
              try {
                  await new Promise(resolve => setTimeout(resolve, 500));
                  const canvas = await window.html2canvas(receiptRef.current, {
                      scale: 3,
                      backgroundColor: null,
                      useCORS: true,
                      logging: false,
                      windowWidth: 1600,
                  });
                  
                  const link = document.createElement('a');
                  link.download = `hangeul-card-${new Date().getTime()}.png`;
                  link.href = canvas.toDataURL('image/png');
                  link.click();
              } catch (err) {
                  console.error("Card generation failed", err);
                  alert("Image generation failed.");
              } finally {
                  setIsDownloading(false);
              }
          };

          const renderCookies = (word) => {
            const chars = word.ko.split('');

            if (len >= 4) {
              const splitIndex = Math.ceil(len / 2);
              const topRow = chars.slice(0, splitIndex);
              const bottomRow = chars.slice(splitIndex);

              return (
                <div className="flex flex-col gap-1 items-center -space-y-4">
                   <div className="flex gap-1">
                      {topRow.map((char, i) => (
                        <Cookie key={`top-${i}`} char={char} delay={i * 0.1} />
                      ))}
                   </div>
                   <div className="flex gap-1">
                      {bottomRow.map((char, i) => (
                        <Cookie key={`btm-${i}`} char={char} delay={(splitIndex + i) * 0.1} />
                      ))}
                   </div>
                </div>
              );
            }

            return (
              <div className="flex flex-wrap justify-center gap-2">
                {chars.map((char, index) => (
                  <Cookie 
                    key={`${word.ko}-${index}`} 
                    char={char} 
                    delay={index * 0.1} 
                  />
                ))}
              </div>
            );
          };

          return (
            <div className="w-full max-w-[420px] mx-auto relative group">
              <div className="absolute inset-0 bg-black rounded-[2.5rem] translate-x-4 translate-y-4 md:translate-x-5 md:translate-y-5"></div>

              <div className={`
                rounded-[2.5rem] border-[6px] border-black relative overflow-hidden flex flex-col transition-colors duration-500
                ${isLucky ? 'bg-yellow-500' : 'bg-yellow-400'}
              `}>
                
                <div className={`p-4 text-center border-b-[6px] border-black flex items-center justify-between px-6 ${isLucky ? 'bg-yellow-500' : 'bg-yellow-400'}`}>
                    <div className="flex gap-2">
                        <div className="w-3 h-3 rounded-full bg-black"></div>
                        <div className="w-3 h-3 rounded-full bg-white border-2 border-black"></div>
                    </div>
                    <span className="font-black text-black text-lg tracking-widest uppercase">
                        {isLucky ? "★ LUCKY DRAW ★" : "TODAY'S WORD"}
                    </span>
                     <div className="flex gap-2">
                        <div className="w-3 h-3 rounded-full bg-white border-2 border-black"></div>
                        <div className="w-3 h-3 rounded-full bg-black"></div>
                    </div>
                </div>

                <div className="relative min-h-[26rem] bg-purple-50 flex items-center justify-center p-6 overflow-hidden">
                    <div className="absolute inset-0 opacity-10" 
                        style={{ 
                            backgroundImage: 'linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px)', 
                            backgroundSize: '20px 20px' 
                        }}>
                    </div>
                    
                    <AnimatePresence mode="wait">
                      {isSpinning ? (
                         <motion.div
                         key="loader"
                         initial={{ opacity: 0, scale: 0.8 }}
                         animate={{ opacity: 1, scale: 1 }}
                         exit={{ opacity: 0, scale: 0.8 }}
                         className="flex flex-col items-center gap-4 z-10"
                       >
                         <motion.div 
                            animate={{ rotate: 360 }}
                            transition={{ duration: 0.8, repeat: Infinity, ease: "linear" }}
                            className="p-4 bg-black rounded-full"
                         >
                            <RefreshCw className="w-10 h-10 text-yellow-400" />
                         </motion.div>
                         <span className="text-black font-black text-xl tracking-widest animate-pulse">BAKING...</span>
                       </motion.div>
                      ) : currentWord ? (
                        <div className="flex flex-col items-center justify-between w-full h-full py-2 z-10 gap-3">
                          
                          <div className="flex-1 flex items-center justify-center w-full min-h-[140px] scale-110">
                             {renderCookies(currentWord)}
                          </div>
                          
                          <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: 0.4 }}
                            className="w-full space-y-3"
                          >
                            <div className={`border-4 border-black p-3 pb-4 rounded-xl text-center shadow-[4px_4px_0_rgba(0,0,0,0.15)] relative ${isLucky ? 'bg-yellow-200' : 'bg-white'}`}>
                                 <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-black text-yellow-400 text-xs font-black px-3 py-1 rounded-full shadow-sm">
                                    {currentWord.romaji.toUpperCase()}
                                 </div>
                                <h2 className="text-2xl font-black text-black mt-1 leading-tight">{currentWord.en}</h2>
                                <p className="text-gray-500 text-xs font-bold uppercase tracking-wider mt-1">{currentWord.desc}</p>
                            </div>

                            <div className="flex flex-col items-center gap-2">
                                <div className="relative text-center px-2 py-1">
                                    <p className="text-purple-900 font-medium text-sm md:text-base leading-snug italic">
                                      "{currentWord.sentence}"
                                    </p>
                                </div>
                                
                                <button 
                                    onClick={handleDownloadReceipt}
                                    disabled={isDownloading}
                                    className={`
                                        flex items-center gap-2 bg-white text-black text-xs font-black px-5 py-3 rounded-full border-2 border-black 
                                        hover:bg-gray-100 active:scale-95 transition-all shadow-[2px_2px_0_black]
                                        disabled:opacity-50 disabled:cursor-wait
                                    `}
                                >
                                    {isDownloading ? (
                                        <>
                                            <RefreshCw className="w-4 h-4 animate-spin" />
                                            <span>SAVING...</span>
                                        </>
                                    ) : (
                                        <>
                                            <Image className="w-4 h-4" />
                                            <span>SAVE CARD</span>
                                        </>
                                    )}
                                </button>
                            </div>

                          </motion.div>
                        </div>
                      ) : (
                        <div className="text-center z-10">
                            <h3 className="text-4xl font-black text-black mb-2 tracking-tighter transform -rotate-2">PUSH<br/>START</h3>
                            <p className="text-gray-400 font-bold text-sm">Find your word</p>
                        </div>
                      )}
                    </AnimatePresence>
                </div>

                <div className={`p-6 border-t-[6px] border-black relative transition-colors duration-500 ${isLucky ? 'bg-yellow-700' : 'bg-purple-800'}`}>
                    <div className="absolute top-0 left-0 w-full h-2 bg-black/20"></div>

                    <button
                      onClick={handleDispense}
                      disabled={isSpinning}
                      className={`
                        w-full group relative
                        bg-black
                        hover:bg-gray-900
                        active:translate-y-2
                        disabled:opacity-80 disabled:cursor-not-allowed
                        text-yellow-400 font-black text-3xl tracking-widest uppercase
                        py-6 rounded-xl shadow-[0_8px_0_rgba(0,0,0,0.5)] active:shadow-none
                        transition-all duration-100 ease-out
                        flex items-center justify-center gap-3 border-4 border-white
                      `}
                    >
                       <Zap className={`w-8 h-8 fill-yellow-400 group-hover:scale-110 transition-transform ${isSpinning ? 'animate-pulse' : ''}`} />
                       <span>{currentWord ? 'RETRY' : 'START'}</span>
                    </button>
                    
                    <div className="mt-4 text-center">
                         <span className={`${isLucky ? 'text-yellow-200' : 'text-purple-300/50'} text-xs font-bold tracking-[0.2em]`}>
                            INSERT COIN TO PLAY
                         </span>
                    </div>
                </div>
              </div>

              <div style={{ position: 'absolute', top: 0, left: 0, zIndex: -50, pointerEvents: 'none', visibility: 'visible' }}>
                 <PhotoCardTemplate 
                    ref={receiptRef} 
                    word={currentWord} 
                    date={new Date().toLocaleDateString('ko-KR')} 
                    isLucky={isLucky}
                 />
              </div>

            </div>
          );
        };

        // ProductShowcase Component
        const ProductShowcase = () => {
          return (
            <div className="mt-12 w-full max-w-2xl mx-auto flex flex-col items-center px-6 text-center">
                
              <h3 className="text-yellow-400 font-black text-2xl md:text-3xl mb-6 tracking-wide drop-shadow-[2px_2px_0_rgba(0,0,0,1)]">
                Want real Hangeul Cookies?
              </h3>

              <a 
                href="https://hangeulkwaja.com/?NaPm=ct%3Dmitw4ew1%7Cci%3Dcheckout%7Ctr%3Dds%7Ctrx%3Dnull%7Chk%3D7304ed45e84a232479073b6f5c5ccf40f557baaf" 
                target="_blank" 
                rel="noopener noreferrer"
                className="
                    group relative
                    flex items-center justify-center gap-3
                    bg-white text-black 
                    w-full md:w-auto
                    px-8 py-4 
                    rounded-full 
                    font-black text-xl md:text-2xl 
                    tracking-tight
                    border-[4px] border-yellow-400
                    hover:bg-yellow-400 hover:border-white hover:text-black
                    transition-all duration-300
                    shadow-[0_0_20px_rgba(250,204,21,0.3)]
                    hover:shadow-[0_0_40px_rgba(250,204,21,0.6)]
                "
              >
                <ShoppingBag className="w-6 h-6 md:w-8 md:h-8" />
                <span>VISIT OFFICIAL STORE</span>
                <div className="bg-black text-white rounded-full p-1 group-hover:bg-white group-hover:text-black transition-colors ml-2">
                    <ArrowRight className="w-5 h-5" />
                </div>
              </a>
              
            </div>
          );
        };

        // App Component
        const App = () => {
          return (
            <div className="min-h-screen bg-[#2E1065] text-white pb-20 overflow-x-hidden relative selection:bg-yellow-400 selection:text-black">
              
              <div className="fixed inset-0 overflow-hidden pointer-events-none">
                <div className="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-[#581c87] rounded-full blur-[120px] opacity-50"></div>
                <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#000000] rounded-full blur-[100px] opacity-60"></div>
                
                <div className="absolute top-[20%] right-[10%] w-4 h-4 bg-yellow-400 rounded-full blur-[2px] opacity-80 animate-pulse"></div>
                <div className="absolute bottom-[30%] left-[5%] w-6 h-6 bg-yellow-400 rounded-full blur-[4px] opacity-60"></div>
              </div>

              <div className="relative z-10 container mx-auto px-4 max-w-4xl pt-8 md:pt-16 flex flex-col items-center">
                
                <div className="text-center mb-10 flex flex-col items-center">
                  <div className="inline-block bg-yellow-400 text-black font-korean text-2xl md:text-3xl px-6 py-2 rounded-full border-4 border-black mb-4 shadow-[4px_4px_0_rgba(0,0,0,1)] transform -rotate-3 hover:scale-105 transition-transform cursor-default">
                    한글과자
                  </div>
                  
                  <h1 className="text-5xl md:text-7xl font-black text-white drop-shadow-[4px_4px_0_rgba(0,0,0,1)] tracking-tight uppercase leading-none">
                    Hangeul<br/>
                    <span className="text-yellow-400 text-6xl md:text-8xl">Kwaja</span>
                  </h1>
                  
                  <p className="mt-6 text-lg md:text-xl text-purple-200 font-bold tracking-wide">
                    The Original Korean Alphabet Cookie
                  </p>
                </div>

                <VendingMachine />

                <ProductShowcase />

                <footer className="mt-20 text-center text-purple-400/60 text-sm">
                   <p className="font-bold">© HANGEUL KWAJA • ver 5.5</p>
        </footer>

              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
